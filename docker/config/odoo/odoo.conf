[options]
# Database Configuration
db_host = postgres
db_port = 5432
db_user = odoo
db_password = odoo_secure_2024
db_name = odoo18_test

# Server Configuration
http_port = 8069
longpolling_port = 8072
workers = 0
max_cron_threads = 1

# Security
admin_passwd = admin_secure_2024
list_db = True

# Logging
log_level = info
log_handler = :INFO
logfile = /var/log/odoo/odoo.log

# Addons Path Configuration
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons/enterprise,/mnt/extra-addons/user

# Development Configuration
dev_mode = all
test_enable = True
test_file = False

# Data Directory
data_dir = /var/lib/odoo

# Demo Data
without_demo = False
demo = {}

# Language and Localization
language = en_US
timezone = UTC

# Email Configuration (for testing with MailHog)
smtp_server = mailhog
smtp_port = 1025
smtp_user = False
smtp_password = False
smtp_ssl = False

# Session Configuration (using Redis)
session_redis = True
session_redis_host = redis
session_redis_port = 6379
session_redis_password = redis_secure_2024
session_redis_prefix = odoo18_test:

# Resource Limits
limit_memory_soft = 671088640  # 640MB
limit_memory_hard = 805306368  # 768MB
limit_time_cpu = 600
limit_time_real = 1200
limit_time_real_cron = 0

# File Upload
limit_request_size = 52428800  # 50MB

# Multi-processing
proxy_mode = False

# Testing Configuration
test_tags = +standard,-at_install,-post_install

# Enterprise Features
server_wide_modules = base,web